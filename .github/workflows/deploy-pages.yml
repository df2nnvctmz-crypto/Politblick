name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The five fetch-*.yml jobs push their data commits with the default GITHUB_TOKEN, and GitHub
  # deliberately does not fire `push`-triggered workflows for GITHUB_TOKEN-authored pushes (it
  # would otherwise be trivial to build an infinite workflow loop). Without this, the site only
  # redeploys when a human pushes a code change — freshly fetched data could sit committed on
  # main for days without ever reaching the live site. Listing each fetch workflow by name here
  # closes that gap.
  workflow_run:
    workflows:
      - Fetch core data (roster, polls, votes)
      - Fetch Lobbyregister
      - Fetch party donations (Parteispenden)
      - Fetch sidejobs data (Nebeneinkünfte)
      - Fetch committee assignments
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Don't redeploy off a fetch run that failed partway and left nothing new committed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Runs before the Chromium download because it is instant and needs no network: a stale
      # summary should fail the job in seconds rather than after installing a browser.
      #
      # The long-run figures come from a derived summary, and the rule that produces it is
      # necessarily restated in Node because the frontend's own copy runs in the browser. Two
      # implementations drift silently — a wrong loyalty percentage looks exactly like a right
      # one. This recomputes every member from the raw vote strings, sharing no code with either,
      # and also fails if the summary was built from a different archive than the committed one.
      # It blocks the deploy rather than publishing wrong numbers about named people, and exits 0
      # when no archive is present so it never blocks a data-less checkout.
      - name: Verify derived vote-history summary
        run: node scripts/verify-vote-history-summary.mjs

      # scripts/prerender.mjs (part of `npm run build`) drives a headless Chromium to snapshot
      # every route to a real static file — see that script for why. --with-deps pulls in the
      # system libraries Chromium needs on a bare Ubuntu runner, not just the browser binary.
      - run: npx playwright install --with-deps chromium

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
