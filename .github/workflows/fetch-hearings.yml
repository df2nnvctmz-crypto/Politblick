name: Fetch committee hearings

on:
  schedule:
    # Every 4 hours, like the core data: a fast-tracked bill can be heard on Monday and voted on
    # on Thursday, and its statements are posted around the hearing date. Offset by 30 minutes from
    # fetch-core so the two do not push at once. Runs are incremental (listings plus new and recent
    # hearings, ~170 paced requests, ~2 min); once a week a run re-reads every page (~420, ~5 min).
    # A run that finds nothing new writes nothing, so it makes no commit.
    - cron: '30 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-hearings
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Exits non-zero — committing nothing — on any failed request or if the crawl finds far
      # fewer hearings than the last snapshot (see MAX_SHRINK in the script).
      - name: Fetch hearings from bundestag.de
        run: node scripts/fetch-hearings.mjs

      - name: Link statements to the Lobbyregister
        run: node scripts/build-hearings.mjs

      - uses: ./.github/actions/commit-data
        with:
          message: Update committee hearing data
          paths: >-
            data/hearings.json public/data/hearings.json public/data/meta.json
