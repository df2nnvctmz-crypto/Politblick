name: Fetch sidejobs data (Nebeneinkünfte)

on:
  schedule:
    # Once daily, off-peak (per abgeordnetenwatch's own fair-use guidance to run bulk
    # queries outside 22-6 CET). ~630 requests, paced at 2.5s apart, so this one run takes
    # roughly 25 minutes — that's why it's separate from fetch-core's faster, more frequent run.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-sidejobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch sidejobs for every member
        run: node scripts/fetch-sidejobs.mjs

      # Members' declared roles are how a member is tied to a registered lobbyist, so a change
      # here changes the cross-references.
      - name: Rebuild lobby cross-references
        run: node scripts/build-lobby-links.mjs

      - uses: ./.github/actions/commit-data
        with:
          message: Update sidejobs data
          paths: public/data/sidejobs.json public/data/lobby-links.json public/data/meta.json
