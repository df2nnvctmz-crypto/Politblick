name: Fetch core data (roster, polls, votes)

on:
  schedule:
    # Every 4 hours. ~70 requests per run, paced at 1.5s apart — comfortably under
    # abgeordnetenwatch's 30 req/min fair-use limit.
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-core
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the rebase in commit-data can actually replay onto origin/main.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch roster, polls, and vote breakdowns
        run: node scripts/fetch-core.mjs

      # Polls carry the Drucksachen that link them to the Lobbyregister, so new polls mean the
      # lobby cross-references need rebuilding. No network — pure join over committed inputs.
      - name: Rebuild lobby cross-references
        run: node scripts/build-lobby-links.mjs

      - uses: ./.github/actions/commit-data
        with:
          message: Update roster/polls/votes data
          paths: >-
            public/data/roster.json public/data/polls.json
            public/data/poll-results.json public/data/lobby-links.json
            public/data/meta.json
